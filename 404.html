
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="PAWSHIELD Animal Rescue Foundation — Page not found.">

    <title>404 — PAWSHIELD</title>

    <!-- Google Fonts -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =====================================================
           ROOT
        ===================================================== */

        :root {

            --forest: #071b15;
            --forest-2: #0d2820;
            --forest-3: #15372c;

            --ivory: #faf7f0;
            --cream: #f1eadf;

            --orange: #e8753d;
            --orange-dark: #c65b2b;

            --white: #ffffff;

            --text-light: #edf5f0;
            --text-muted: #b9c7c0;

            --line-dark:
                rgba(255,255,255,.14);

            --ease:
                cubic-bezier(.22,.61,.36,1);

        }


        /* =====================================================
           RESET
        ===================================================== */

        * {

            margin: 0;
            padding: 0;

            box-sizing: border-box;

        }


        html {

            scroll-behavior: smooth;

        }


        body {

            min-height: 100vh;

            font-family:
                "DM Sans",
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 42%,
                    rgba(232,117,61,.075),
                    transparent 30%
                ),
                var(--forest);

            color:
                var(--text-light);

            overflow: hidden;

        }


        a {

            text-decoration: none;

            color: inherit;

        }


        button {

            font-family: inherit;

        }


        /* =====================================================
           MAIN PAGE
        ===================================================== */

        .error-page {

            position: relative;

            width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                50px 20px;

            overflow: hidden;

        }


        /* =====================================================
           BACKGROUND GLOW
        ===================================================== */

        .glow {

            position: absolute;

            width: 520px;

            height: 520px;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%,-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(232,117,61,.12),
                    transparent 68%
                );

            pointer-events: none;

            animation:
                glowPulse 6s ease-in-out infinite alternate;

        }


        @keyframes glowPulse {

            0% {

                opacity: .35;

                transform:
                    translate(-50%,-50%)
                    scale(.9);

            }

            100% {

                opacity: .75;

                transform:
                    translate(-50%,-50%)
                    scale(1.08);

            }

        }


        /* =====================================================
           DECORATIVE PAWS
        ===================================================== */

        .paw {

            position: absolute;

            color:
                rgba(255,255,255,.032);

            pointer-events: none;

            z-index: 1;

        }


        .paw-1 {

            top: 14%;

            left: 8%;

            font-size: 100px;

            transform:
                rotate(-25deg);

            animation:
                floatOne 8s ease-in-out infinite;

        }


        .paw-2 {

            top: 19%;

            right: 9%;

            font-size: 75px;

            transform:
                rotate(22deg);

            animation:
                floatTwo 10s ease-in-out infinite;

        }


        .paw-3 {

            left: 15%;

            bottom: 13%;

            font-size: 65px;

            transform:
                rotate(18deg);

            animation:
                floatThree 9s ease-in-out infinite;

        }


        .paw-4 {

            right: 15%;

            bottom: 10%;

            font-size: 105px;

            transform:
                rotate(-20deg);

            animation:
                floatFour 11s ease-in-out infinite;

        }


        @keyframes floatOne {

            0%,100% {

                transform:
                    translateY(0)
                    rotate(-25deg);

            }

            50% {

                transform:
                    translateY(-18px)
                    rotate(-18deg);

            }

        }


        @keyframes floatTwo {

            0%,100% {

                transform:
                    translateY(0)
                    rotate(22deg);

            }

            50% {

                transform:
                    translateY(20px)
                    rotate(28deg);

            }

        }


        @keyframes floatThree {

            0%,100% {

                transform:
                    translateY(0)
                    rotate(18deg);

            }

            50% {

                transform:
                    translateY(-14px)
                    rotate(24deg);

            }

        }


        @keyframes floatFour {

            0%,100% {

                transform:
                    translateY(0)
                    rotate(-20deg);

            }

            50% {

                transform:
                    translateY(16px)
                    rotate(-27deg);

            }

        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .error-content {

            position: relative;

            z-index: 5;

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

        }


        /* =====================================================
           404 NUMBER
        ===================================================== */

        .error-number {

            position: relative;

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(150px, 26vw, 310px);

            font-weight: 500;

            line-height: .72;

            letter-spacing:
                -.085em;

            color:
                var(--ivory);

            opacity: 0;

            transform:
                translateY(30px)
                scale(.94);

            filter:
                blur(4px);

            animation:
                numberReveal 1s
                var(--ease)
                .1s forwards;

        }


        @keyframes numberReveal {

            0% {

                opacity: 0;

                transform:
                    translateY(30px)
                    scale(.94);

                filter:
                    blur(4px);

            }

            100% {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter:
                    blur(0);

            }

        }


        /* =====================================================
           NUMBER LINE
        ===================================================== */

        .error-number::after {

            content: "";

            position: absolute;

            left: 50%;

            bottom: 3%;

            width: 48%;

            height: 2px;

            transform:
                translateX(-50%);

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--orange),
                    transparent
                );

            opacity: .7;

        }


        /* =====================================================
           PAW ICON
        ===================================================== */

        .error-icon {

            width: 72px;

            height: 72px;

            margin-top: 25px;

            display: grid;

            place-items: center;

            border:
                1px solid
                rgba(232,117,61,.36);

            border-radius: 50%;

            background:
                rgba(232,117,61,.055);

            color:
                var(--orange);

            font-size: 26px;

            box-shadow:
                0 0 0 9px
                rgba(232,117,61,.025);

            opacity: 0;

            transform:
                scale(.65)
                rotate(-8deg);

            animation:
                iconReveal .8s
                var(--ease)
                .5s forwards;

        }


        @keyframes iconReveal {

            0% {

                opacity: 0;

                transform:
                    scale(.65)
                    rotate(-8deg);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0);

            }

        }


        /* =====================================================
           ICON FLOAT
        ===================================================== */

        .error-icon {

            animation:
                iconReveal .8s
                var(--ease)
                .5s forwards,
                iconFloat 3.5s
                ease-in-out
                1.4s infinite;

        }


        @keyframes iconFloat {

            0%,100% {

                transform:
                    translateY(0)
                    scale(1);

            }

            50% {

                transform:
                    translateY(-5px)
                    scale(1.02);

            }

        }


        /* =====================================================
           EYEBROW
        ===================================================== */

        .eyebrow {

            margin-top: 25px;

            margin-bottom: 11px;

            font-size: 10px;

            font-weight: 700;

            letter-spacing: .24em;

            text-transform: uppercase;

            color:
                var(--orange);

            opacity: 0;

            transform:
                translateY(12px);

            animation:
                textReveal .7s
                var(--ease)
                .7s forwards;

        }


        /* =====================================================
           TITLE
        ===================================================== */

        .error-title {

            font-family:
                "Playfair Display",
                serif;

            font-size:
                clamp(36px,5vw,60px);

            line-height: 1.05;

            font-weight: 500;

            color:
                var(--ivory);

            margin-bottom: 14px;

            opacity: 0;

            transform:
                translateY(15px);

            animation:
                textReveal .7s
                var(--ease)
                .82s forwards;

        }


        /* =====================================================
           DESCRIPTION
        ===================================================== */

        .error-description {

            width: 100%;

            max-width: 560px;

            margin: 0 auto;

            font-size: 15px;

            line-height: 1.75;

            color:
                var(--text-muted);

            opacity: 0;

            transform:
                translateY(12px);

            animation:
                textReveal .7s
                var(--ease)
                .94s forwards;

        }


        @keyframes textReveal {

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .error-actions {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin-top: 25px;

            opacity: 0;

            transform:
                translateY(12px);

            animation:
                textReveal .7s
                var(--ease)
                1.06s forwards;

        }


        .btn {

            min-height: 49px;

            padding:
                0 23px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            border-radius: 3px;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .06em;

            cursor: pointer;

            transition:
                transform .3s ease,
                background .3s ease,
                border-color .3s ease,
                color .3s ease,
                box-shadow .3s ease;

        }


        /* =====================================================
           PRIMARY BUTTON
        ===================================================== */

        .btn-primary {

            color:
                var(--white);

            background:
                var(--orange);

            border:
                1px solid
                var(--orange);

        }


        .btn-primary:hover {

            background:
                var(--orange-dark);

            border-color:
                var(--orange-dark);

            transform:
                translateY(-3px);

            box-shadow:
                0 10px 25px
                rgba(232,117,61,.15);

        }


        /* =====================================================
           OUTLINE BUTTON
        ===================================================== */

        .btn-outline {

            color:
                var(--text-light);

            background:
                rgba(255,255,255,.025);

            border:
                1px solid
                rgba(255,255,255,.17);

        }


        .btn-outline:hover {

            color:
                var(--orange);

            border-color:
                rgba(232,117,61,.55);

            transform:
                translateY(-3px);

        }


        /* =====================================================
           BOTTOM MICRO TEXT
        ===================================================== */

        .error-bottom {

            position: absolute;

            left: 50%;

            bottom: 18px;

            transform:
                translateX(-50%);

            width:
                calc(100% - 40px);

            text-align: center;

            font-size: 9px;

            font-weight: 500;

            letter-spacing: .15em;

            text-transform: uppercase;

            color:
                rgba(237,245,240,.25);

            z-index: 5;

        }


        .error-bottom span {

            color:
                rgba(232,117,61,.7);

        }


        /* =====================================================
           BUTTON CLICK
        ===================================================== */

        .btn.clicked {

            transform:
                scale(.97);

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            body {

                overflow: hidden;

            }


            .error-page {

                min-height: 100svh;

                padding:
                    35px 20px 55px;

            }


            .error-content {

                max-width: 100%;

            }


            .error-number {

                font-size:
                    clamp(125px, 40vw, 190px);

            }


            .error-icon {

                width: 64px;

                height: 64px;

                margin-top: 22px;

                font-size: 23px;

            }


            .eyebrow {

                margin-top: 23px;

                font-size: 9px;

            }


            .error-title {

                font-size: 36px;

                line-height: 1.08;

                margin-bottom: 12px;

            }


            .error-description {

                max-width: 500px;

                font-size: 13.5px;

                line-height: 1.7;

            }


            .error-actions {

                width: 100%;

                flex-direction: column;

                gap: 9px;

                margin-top: 23px;

            }


            .error-actions .btn {

                width:
                    min(100%, 320px);

            }


            .paw-1 {

                left: -28px;

                top: 13%;

                font-size: 70px;

            }


            .paw-2 {

                right: -24px;

                top: 25%;

                font-size: 58px;

            }


            .paw-3 {

                left: -18px;

                bottom: 18%;

                font-size: 50px;

            }


            .paw-4 {

                right: -25px;

                bottom: 12%;

                font-size: 75px;

            }


            .glow {

                width: 380px;

                height: 380px;

            }


            .error-bottom {

                bottom: 12px;

                font-size: 7.5px;

            }

        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 400px) {

            .error-page {

                padding:
                    25px 16px 45px;

            }


            .error-number {

                font-size: 125px;

            }


            .error-icon {

                width: 58px;

                height: 58px;

                margin-top: 18px;

                font-size: 21px;

            }


            .eyebrow {

                margin-top: 20px;

                font-size: 8px;

                letter-spacing: .18em;

            }


            .error-title {

                font-size: 30px;

            }


            .error-description {

                font-size: 12.5px;

            }


            .error-actions {

                margin-top: 20px;

            }


            .btn {

                min-height: 46px;

            }

        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         404 PAGE
    ===================================================== -->

    <main class="error-page">


        <!-- Background glow -->

        <div class="glow"></div>


        <!-- Decorative paw silhouettes -->

        <i class="fa-solid fa-paw paw paw-1"></i>

        <i class="fa-solid fa-paw paw paw-2"></i>

        <i class="fa-solid fa-paw paw paw-3"></i>

        <i class="fa-solid fa-paw paw paw-4"></i>


        <!-- Main content -->

        <div class="error-content">


            <!-- 404 -->

            <div class="error-number">
                404
            </div>


            <!-- Paw -->

            <div class="error-icon">

                <i class="fa-solid fa-paw"></i>

            </div>


            <!-- Eyebrow -->

            <div class="eyebrow">
                PAWSHIELD · PAGE NOT FOUND
            </div>


            <!-- Title -->

            <h1 class="error-title">
                This trail went cold.
            </h1>


            <!-- Description -->

            <p class="error-description">

                The page you're looking for may have moved,
                been removed, or never existed. Let's get you
                back somewhere safer.

            </p>


            <!-- Buttons -->

            <div class="error-actions">


                <a href="index.html"
                   class="btn btn-primary">

                    Back to Home

                    <i class="fa-solid fa-arrow-right"></i>

                </a>


                <button type="button"
                        class="btn btn-outline"
                        id="goBackBtn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Go Back

                </button>


            </div>


        </div>


        <!-- Bottom message -->

        <div class="error-bottom">

            Every lost trail deserves
            <span>a way home.</span>

        </div>


    </main>



    <script>

        /* =====================================================
           GO BACK
        ===================================================== */

        const goBackBtn =
            document.getElementById("goBackBtn");


        if (goBackBtn) {

            goBackBtn.addEventListener(
                "click",
                () => {

                    goBackBtn.classList.add("clicked");


                    setTimeout(() => {

                        if (window.history.length > 1) {

                            window.history.back();

                        } else {

                            window.location.href =
                                "index.html";

                        }

                    }, 120);

                }
            );

        }


        /* =====================================================
           BUTTON MICRO INTERACTION
        ===================================================== */

        document
            .querySelectorAll(".btn")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        button.classList.add("clicked");


                        setTimeout(() => {

                            button.classList.remove(
                                "clicked"
                            );

                        }, 130);

                    }
                );

            });


        /* =====================================================
           SUBTLE MOUSE PARALLAX
           Desktop only
        ===================================================== */

        const errorPage =
            document.querySelector(".error-page");

        const errorNumber =
            document.querySelector(".error-number");

        const pawElements =
            document.querySelectorAll(".paw");


        if (
            errorPage &&
            errorNumber &&
            window.matchMedia(
                "(hover: hover)"
            ).matches
        ) {

            errorPage.addEventListener(
                "mousemove",
                (event) => {

                    const x =
                        (event.clientX /
                            window.innerWidth - .5) * 5;

                    const y =
                        (event.clientY /
                            window.innerHeight - .5) * 4;


                    errorNumber.style.marginLeft =
                        `${x}px`;

                    errorNumber.style.marginTop =
                        `${y}px`;


                    pawElements.forEach(
                        (paw, index) => {

                            const strength =
                                (index + 1) * .35;

                            paw.style.marginLeft =
                                `${x * strength}px`;

                            paw.style.marginTop =
                                `${y * strength}px`;

                        }
                    );

                }
            );


            errorPage.addEventListener(
                "mouseleave",
                () => {

                    errorNumber.style.marginLeft =
                        "0px";

                    errorNumber.style.marginTop =
                        "0px";


                    pawElements.forEach(paw => {

                        paw.style.marginLeft =
                            "0px";

                        paw.style.marginTop =
                            "0px";

                    });

                }
            );

        }

    </script>

</body>

</html>
